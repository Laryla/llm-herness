services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: llm_harness
      MYSQL_ROOT_PASSWORD: harness_test
    ports:
      - "33306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pharness_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: llm_harness
      POSTGRES_PASSWORD: harness_test
      POSTGRES_USER: postgres
    ports:
      - "35432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_harness"]
      interval: 2s
      timeout: 3s
      retries: 30
